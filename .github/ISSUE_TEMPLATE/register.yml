name: ثبت‌نام در درس مهندسی اینترنت
description: ساختن مخزن خصوصی تحویل تمرین‌ها، یک بار برای کل ترم
title: "ثبت‌نام"
body:
  - type: markdown
    attributes:
      value: |
        <div dir="rtl">

        ## ثبت‌نام در درس مهندسی اینترنت

        با این فرم، مخزن خصوصی تحویل تمرین‌هایتان در GitHub ساخته می‌شود. فقط یک بار در ترم لازم است.

        1. شمارهٔ دانشجویی‌تان را در کادر پایین بنویسید.
        2. دکمهٔ سبز پایین فرم را بزنید.
        3. یکی دو دقیقه صبر کنید. پاسخ زیر همین صفحه می‌آید و ایمیل دعوت مخزن هم برایتان فرستاده می‌شود.

        <sub>شماره‌ای که اینجا می‌نویسید در این صفحه دیده می‌شود.</sub>

        </div>
  - type: input
    id: sid
    attributes:
      label: شمارهٔ دانشجویی
      description: فقط رقم، همان شماره‌ای که در دانشگاه دارید
      placeholder: "401234567"
    validations:
      required: true
