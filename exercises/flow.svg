<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 510" width="680" height="510" direction="rtl" role="img" font-family="Vazirmatn, Tahoma, 'Segoe UI', sans-serif">
<title>تحویل و تصحیح تمرین</title>
<desc>شما تمرین را انجام می‌دهید، با خودآزمایی بررسی می‌کنید و به شاخهٔ main مخزن خودتان push می‌کنید. بعد از مهلت، حل‌تمرین همه را خودکار تصحیح می‌کند و نمره را به‌صورت یک issue در مخزن شما می‌گذارد. اعتراض را در همان issue می‌نویسید.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="510" rx="16" fill="#FFFFFF"/>
<g fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4">
<rect x="40" y="20" width="190" height="470" rx="12"/>
<rect x="245" y="20" width="180" height="470" rx="12"/>
<rect x="440" y="20" width="190" height="470" rx="12"/>
</g>
<g font-size="15" font-weight="500" fill="#2C2C2A" text-anchor="middle">
<text x="135" y="48">حل‌تمرین</text>
<text x="335" y="48">GitHub</text>
<text x="535" y="48">شما</text>
</g>
<g stroke-width="1" text-anchor="middle">
<g><rect x="455" y="70" width="160" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7"/><text x="535" y="94" font-size="14" font-weight="500" fill="#3C3489">انجام تمرین</text><text x="535" y="114" font-size="12" fill="#534AB7">در پوشهٔ ex01</text></g>
<g><rect x="455" y="156" width="160" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7"/><text x="535" y="180" font-size="14" font-weight="500" fill="#3C3489">خودآزمایی</text><text x="535" y="200" font-size="12" fill="#534AB7">تا همه‌چیز ✓ شود</text></g>
<g><rect x="455" y="242" width="160" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7"/><text x="535" y="266" font-size="14" font-weight="500" fill="#3C3489">push به main</text><text x="535" y="286" font-size="12" fill="#534AB7">تحویل همین است</text></g>
<g><rect x="255" y="242" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/><text x="335" y="266" font-size="14" font-weight="500" fill="#444441">مخزن شما</text><text x="335" y="286" font-size="12" fill="#5F5E5A">آخرین push پیش از مهلت</text></g>
<g><rect x="55" y="334" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56"/><text x="135" y="358" font-size="14" font-weight="500" fill="#085041">تصحیح خودکار</text><text x="135" y="378" font-size="12" fill="#0F6E56">بعد از مهلت</text></g>
<g><rect x="55" y="420" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56"/><text x="135" y="444" font-size="14" font-weight="500" fill="#085041">فرستادن نمره</text><text x="135" y="464" font-size="12" fill="#0F6E56">به مخزن هر نفر</text></g>
<g><rect x="255" y="420" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/><text x="335" y="444" font-size="14" font-weight="500" fill="#444441">issue نمره</text><text x="335" y="464" font-size="12" fill="#5F5E5A">نمره و ریز آن</text></g>
<g><rect x="455" y="420" width="160" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7"/><text x="535" y="444" font-size="14" font-weight="500" fill="#3C3489">دیدن نمره</text><text x="535" y="464" font-size="12" fill="#534AB7">سؤال؟ همان‌جا بپرسید</text></g>
</g>
<g stroke="#5F5E5A" stroke-width="1.2" fill="none" marker-end="url(#a)">
<line x1="535" y1="126" x2="535" y2="152"/>
<line x1="535" y1="212" x2="535" y2="238"/>
<line x1="455" y1="270" x2="419" y2="270"/>
<path d="M335 298 L335 362 L219 362"/>
<line x1="135" y1="390" x2="135" y2="416"/>
<line x1="215" y1="448" x2="251" y2="448"/>
<line x1="415" y1="448" x2="451" y2="448"/>
</g>
<g stroke="#888780" stroke-width="1" stroke-dasharray="3 3">
<line x1="40" y1="316" x2="500" y2="316"/>
<line x1="570" y1="316" x2="630" y2="316"/>
</g>
<text x="535" y="320" font-size="12" fill="#5F5E5A" text-anchor="middle">مهلت</text>
</svg>
